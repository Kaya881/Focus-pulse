<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Analyzer — Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 50px 40px;
            width: 420px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .logo {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo .icon {
            font-size: 52px;
            display: block;
            margin-bottom: 12px;
        }

        .logo h1 {
            color: #fff;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .logo p {
            color: rgba(255,255,255,0.5);
            font-size: 13px;
            margin-top: 6px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: rgba(255,255,255,0.7);
            font-size: 13px;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
        }

        input:focus {
            border-color: #7c6ff7;
            background: rgba(124,111,247,0.1);
            box-shadow: 0 0 0 3px rgba(124,111,247,0.2);
        }

        input::placeholder { color: rgba(255,255,255,0.3); }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #7c6ff7, #5b4fcf);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s;
            letter-spacing: 0.5px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(124,111,247,0.4);
        }

        .error {
            background: rgba(255,80,80,0.15);
            border: 1px solid rgba(255,80,80,0.3);
            color: #ff6b6b;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
        }

        .hint {
            text-align: center;
            color: rgba(255,255,255,0.35);
            font-size: 12px;
            margin-top: 20px;
        }

        .hint span { color: rgba(124,111,247,0.8); }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <span class="icon">🧠</span>
            <h1>AI Study Analyzer</h1>
            <p>Smart Focus & Fatigue Detection System</p>
        </div>

        {% if error %}
        <div class="error">⚠️ {{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label>USERNAME</label>
                <input type="text" name="username" placeholder="Enter your username" required autofocus>
            </div>
            <div class="form-group">
                <label>PASSWORD</label>
                <input type="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn">Sign In →</button>
        </form>

       <p class="hint">No Accounts? <a href="/signup" style="color:#7c6ff7;text-decoration:none;font-weight:600;">Sign Up Here</a></p>
    </div>
</body>
</html>
