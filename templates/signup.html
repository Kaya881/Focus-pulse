<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Analyzer — Sign Up</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 50px 40px;
            width: 440px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .logo {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo .icon { font-size: 52px; display: block; margin-bottom: 12px; }

        .logo h1 {
            color: #fff;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .logo p {
            color: rgba(255,255,255,0.5);
            font-size: 13px;
            margin-top: 6px;
        }

        .form-group { margin-bottom: 18px; }

        label {
            display: block;
            color: rgba(255,255,255,0.7);
            font-size: 13px;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 13px 18px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
        }

        input:focus {
            border-color: #7c6ff7;
            background: rgba(124,111,247,0.1);
            box-shadow: 0 0 0 3px rgba(124,111,247,0.2);
        }

        input::placeholder { color: rgba(255,255,255,0.3); }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #7c6ff7, #5b4fcf);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(124,111,247,0.4);
        }

        .error {
            background: rgba(255,80,80,0.15);
            border: 1px solid rgba(255,80,80,0.3);
            color: #ff6b6b;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
        }

        .success {
            background: rgba(0,200,83,0.15);
            border: 1px solid rgba(0,200,83,0.3);
            color: #00c853;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: rgba(255,255,255,0.4);
            font-size: 13px;
        }

        .login-link a {
            color: #7c6ff7;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover { text-decoration: underline; }

        .password-hint {
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <span class="icon">🧠</span>
            <h1>Create Account</h1>
            <p>AI Study Analyzer mein join karo</p>
        </div>

        {% if error %}
        <div class="error">⚠️ {{ error }}</div>
        {% endif %}

        {% if success %}
        <div class="success">✅ {{ success }}</div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label>USERNAME</label>
                <input type="text" name="username" placeholder="Apna username chunein" required autofocus>
            </div>
            <div class="form-group">
                <label>EMAIL</label>
                <input type="email" name="email" placeholder="apka@email.com" required>
            </div>
            <div class="form-group">
                <label>PASSWORD</label>
                <input type="password" name="password" placeholder="Password banayein" required>
                <p class="password-hint">Kam az kam 6 characters</p>
            </div>
            <div class="form-group">
                <label>CONFIRM PASSWORD</label>
                <input type="password" name="confirm" placeholder="Password dobara likhein" required>
            </div>
            <button type="submit" class="btn">Account Banao →</button>
        </form>

        <p class="login-link">
            Pehle se account hai? <a href="/login">Login karo</a>
        </p>
    </div>
</body>
</html>
